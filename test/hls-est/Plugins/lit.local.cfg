# The plugin tests (hls-doc/plugins.md): hls-est loads plugin libraries the
# CIRCT build made (test/hls-est/Plugins/CMakeLists.txt,
# tools/hls-est-plugins/CMakeLists.txt).
import os

config.suffixes = [".mlir"]
if "system-windows" in config.available_features:
    config.unsupported = True

def plugin(name):
    return os.path.join(config.circt_shlib_dir, name + config.llvm_shlib_ext)

config.substitutions.append(("%hls_est_test_plugin", plugin("HlsEstTestPlugin")))
config.substitutions.append(("%hlsest_example_plugin", plugin("HlsEstExamplePlugin")))
config.substitutions.append(("%hlsest_polarfire_plugin", plugin("HlsEstPolarFirePlugin")))
config.substitutions.append(("%hlsest_polarfire_dir",
                             os.path.join(config.circt_src_root, "tools",
                                          "hls-est-plugins", "polarfire")))
